name: CI Workflow — CareerLens

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend Test Suite & Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations (SQLite test)
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Run Pytest test suite
        run: |
          pytest -v

      - name: Run Evaluation Benchmark pipeline
        run: |
          python -m backend.app.evaluation.pipeline

  frontend-tests:
    name: Frontend Quality & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps

      - name: Run Vitest component tests
        working-directory: ./frontend
        run: |
          npm test

      - name: Build production bundle
        working-directory: ./frontend
        run: |
          npm run build
