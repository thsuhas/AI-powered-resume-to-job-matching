services:
  # Primary Database
  db:
    image: postgres:15-alpine
    container_name: careerlens_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerlens_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}"
      POSTGRES_DB: ${POSTGRES_DB:-careerlens_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerlens_user} -d ${POSTGRES_DB:-careerlens_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: careerlens_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-careerlens_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}@db:5432/${POSTGRES_DB:-careerlens_db}"
      CORS_ORIGINS: "[\"http://localhost:3000\", \"http://localhost:5173\", \"http://localhost\"]"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend Nginx Web Server
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: careerlens_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
